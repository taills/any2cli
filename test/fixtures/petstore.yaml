openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A sample pet store used by anycli tests.
servers:
  - url: '{scheme}://petstore.example.test/{basePath}'
    variables:
      scheme:
        default: https
      basePath:
        default: v1
components:
  securitySchemes:
    petAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.test/authorize
          tokenUrl: https://auth.example.test/token
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The pet's name
        tag:
          type: string
        owner:
          $ref: '#/components/schemas/Owner'
    Owner:
      type: object
      properties:
        name:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: How many items to return
          schema:
            type: integer
            maximum: 100
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: X-Request-Id
          in: header
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: ok
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The id of the pet
        schema:
          type: integer
    get:
      operationId: getPetById
      summary: Info for a specific pet
      tags: [pets]
      responses:
        '200':
          description: ok
    delete:
      summary: Delete a pet
      tags: [admin]
      responses:
        '204':
          description: deleted
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      summary: Upload a photo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '200':
          description: ok
  /search:
    get:
      operationId: search
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              status:
                type: string
      responses:
        '200':
          description: ok
    post:
      operationId: bulkSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: ok
  /login:
    post:
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: ok
  /download:
    get:
      operationId: download
      responses:
        '200':
          description: binary
